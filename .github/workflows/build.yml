name: Build Aurora IME APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 生成 Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 运行单元测试
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: 构建 APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-ime-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: 发布到 Release (仅 tag 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: false
          body: |
            ## Aurora IME ${{ github.ref_name }}

            ### 真机安装
            1. 下载下方 `app-debug.apk`
            2. 手机浏览器下载后点「安装」，允许"未知来源"
            3. 设置 → 系统 → 语言和输入法 → 启用 Aurora IME
            4. 切换到 Aurora IME 即可使用
